[project]
name = "playwright-test-framework"
version = "0.1.0"
description = "Test automation framework for the subscription service app (API + UI + DB): Playwright, Pytest, Poetry."
authors = [
    {name = "onhorou"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-playwright (>=0.10.0,<0.11.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
