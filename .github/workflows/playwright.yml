# CI-пайплайн тестового фреймворка.
#
# Запуск — ТОЛЬКО вручную (`workflow_dispatch`): автоматических триггеров
# (push/pull_request) намеренно нет. При ручном запуске выбирается набор тестов
# (smoke / regression) либо один конкретный тест по nodeid.
#
# Пайплайн переиспользует контейнеризацию проекта (`docker-compose.yml`):
# поднимаются приложение-мишень, его PostgreSQL и контейнер с pytest, а выбор
# набора передаётся в контейнер переменной окружения PYTEST_ARGS.
name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Набор тестов: smoke (быстрый) или regression (полный)"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - regression
      test:
        description: >-
          Отдельный тест (путь или nodeid), например
          tests/api/test_auth.py::test_login_creates_account_and_returns_profile.
          Если задан — перекрывает выбранный набор.
        type: string
        required: false
        default: ""

# `pages: write` — публикация Allure-отчёта на GitHub Pages;
# `id-token: write` — запрос OIDC-токена, которым `actions/deploy-pages`
# подтверждает право на деплой.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Одновременные ручные запуски одной ветки не отменяют друг друга.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare run
        id: prepare
        env:
          SUITE: ${{ inputs.suite }}
          TEST: ${{ inputs.test }}
        run: |
          # Каталоги-артефакты создаём заранее, а контейнер `tests` запускаем от
          # пользователя раннера (DOCKER_UID/DOCKER_GID): иначе bind-mount тома
          # принадлежат root, и pytest не может в них писать
          # (см. `user:` в docker-compose.yml).
          mkdir -p allure-results logs
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

          if [ -n "$TEST" ]; then
            pytest_args="$TEST"
          elif [ "$SUITE" = "smoke" ]; then
            pytest_args="-m smoke"
          else
            pytest_args="-m regression"
          fi

          echo "pytest_args=$pytest_args" >> "$GITHUB_OUTPUT"
          echo "Selected pytest arguments: '$pytest_args'"

      - name: Run tests
        env:
          PYTEST_ARGS: ${{ steps.prepare.outputs.pytest_args }}
        run: docker compose up --build --exit-code-from tests

      # ── Публикация Allure-отчёта на GitHub Pages ─────────────────────────────
      # HTML-отчёт собирается прямо на раннере (в `ubuntu-latest` есть Node и
      # Java), а не в тестовом образе: образ содержит только runtime-зависимости
      # (см. Dockerfile), инструменты отчётности в него не попадают.
      # Все шаги помечены `if: always()`, чтобы отчёт был собран и опубликован
      # даже при падении тестов.
      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Generate Allure report
        if: always()
        run: npx --yes allure-commandline@2.46.1 generate allure-results -o allure-report --clean

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          if-no-files-found: warn

  # Публикация собранного отчёта на GitHub Pages. Джоб вынесен отдельно —
  # так рекомендует `actions/deploy-pages` (деплой требует своего окружения
  # и прав). `needs: tests` плюс `if: always()` нужны, чтобы отчёт публиковался
  # и при падении тестов (иначе зависимый джоб был бы пропущен).
  deploy:
    name: Deploy Allure report
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      # Одновременные деплои Pages не допускаются (требование механизма).
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize report URL
        run: |
          echo "Allure report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
