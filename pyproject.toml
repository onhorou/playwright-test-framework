[project]
name = "playwright-test-framework"
version = "0.1.0"
description = "Test automation framework for the subscription service app (API + UI + DB): Playwright, Pytest, Poetry."
authors = [
    {name = "onhorou"}
]
license = {text = "MIT"}
readme = "README.md"
# PEP 440-совместимое ограничение (эквивалент poetry `^3.13`): требуется для
# корректного чтения конфигурации `pyproject.toml` инструментами (ruff и др.).
requires-python = ">=3.13,<4.0"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-playwright (>=0.10.0,<0.11.0)",
    "allure-pytest (>=2.16.0,<3.0.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "filelock (>=4.1.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)"
]

[tool.ruff]
# Целевая версия Python — синхронно с `requires-python` и `.python-version`.
target-version = "py313"
# Длина строки: совпадает со стилем проекта и форматтером ruff.
line-length = 100
# Корень импортов: пакеты `config`, `utils`, `tests` распознаются как first-party.
src = ["."]
# Не линтим окружение и артефакты сборки.
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E/W — pycodestyle, F — Pyflakes, I — isort, PT — pytest-style, S — bandit.
select = ["E", "W", "F", "I", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# В тестах `assert` — основной механизм проверок, S101 здесь неприменим.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
# Плагин Pydantic — корректный вывод типов из полей моделей и настроек.
plugins = ["pydantic.mypy"]
# Строгая типизация кода фреймворка.
strict = true

[[tool.mypy.overrides]]
# `allure-python` не поставляет аннотаций типов, поэтому декораторы `@allure.*`
# mypy видит как нетипизированные и считает размеченные функции «нетипизированными»
# (теряется их сигнатура). Отключаем эту проверку в слоях, которые размечают
# отчётность: Page Object'ах, API-клиентах и тестах.
module = ["pages.*", "api_manager.*", "tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# В тестах допускаем отсутствие аннотаций типов у функций и вызовы
# нетипизированных функций (в том числе `allure.*`): тесты — тонкий слой
# поверх типизированного фреймворка.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
