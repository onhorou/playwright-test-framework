# Настройки Pytest хранятся в отдельном файле (не в `pyproject.toml`).
#
# Любой запуск `pytest` пишет результаты Allure в `allure-results/`, а ключ
# `--clean-alluredir` очищает каталог перед запуском, чтобы отчёт отражал
# только текущую сессию. Каталог исключён из Git (`.gitignore`).
# HTML-отчёт формируется командой `allure generate` (см. README → Reporting).
[pytest]
addopts = --alluredir=allure-results --clean-alluredir

# Маркеры наборов тестов (используются в CI и при локальном запуске):
#   smoke      — критический набор: быстрая проверка ключевых сценариев;
#   regression — полный регрессионный набор (подмножество smoke включено).
# Выбор набора: `pytest -m smoke`, `pytest -m regression`.
markers =
    smoke: Критический набор (smoke): быстрая проверка ключевых сценариев.
    regression: Регрессионный набор: полная проверка функциональности.
